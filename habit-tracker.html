<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1f2330;
    --muted: #7a8194;
    --line: #eceef4;
    --accent: #5b6cff;
    --accent-soft: #eef0ff;
    --gold: #f5a524;
    --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 8px 24px rgba(20, 24, 40, .06);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin-top: 4px; }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }

  /* Language switch */
  .lang { display: flex; background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 3px; }
  .lang button {
    border: 0; background: none; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .03em;
    color: var(--muted); padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  .lang button.on { background: var(--accent); color: #fff; }

  /* Add form */
  form#add { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  form#add input, form#add select {
    font: inherit; color: var(--text);
    border: 1px solid var(--line); background: #fafbfd;
    border-radius: 12px; padding: 11px 14px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  form#add input:focus, form#add select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  form#add input[name=name] { flex: 1 1 220px; min-width: 0; }
  form#add select { flex: 0 1 190px; }
  .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 12px; padding: 11px 18px;
    background: var(--accent); color: #fff;
    box-shadow: 0 4px 14px rgba(91, 108, 255, .3);
    transition: transform .1s, box-shadow .15s;
  }
  .btn:hover { box-shadow: 0 6px 18px rgba(91, 108, 255, .38); }
  .btn:active { transform: translateY(1px); }

  /* Week nav */
  .weeknav { display: flex; align-items: center; gap: 8px; }
  .weeknav span { min-width: 140px; text-align: center; font-weight: 600; font-size: 14px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--card); box-shadow: var(--shadow); color: var(--text); font-size: 16px;
  }
  .icon-btn:hover { background: var(--accent-soft); }
  .icon-btn:disabled { opacity: .4; cursor: default; background: var(--card); }
  .link-btn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 6px; }
  .link-btn[hidden] { display: none; }

  /* Grid */
  .grid { display: grid; grid-template-columns: minmax(140px, 1.6fr) repeat(7, minmax(34px, 1fr)) minmax(104px, auto); align-items: center; gap: 6px 4px; }
  .grid .head { font-size: 12px; color: var(--muted); text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding-bottom: 6px; }
  .grid .head.today { color: var(--accent); }
  .grid .head small { display: block; font-size: 15px; color: var(--text); text-transform: none; letter-spacing: 0; }
  .grid .head.today small { color: var(--accent); }
  .grid .head:first-child, .grid .head:last-child { text-align: left; padding-left: 6px; }
  .grid .head:first-child { padding-left: 0; }
  .row-sep { grid-column: 1 / -1; height: 1px; background: var(--line); }

  .habit { min-width: 0; padding-right: 8px; }
  .habit .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .habit .name > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .habit .meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; max-width: 90px; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; transition: width .25s; }
  .del { opacity: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 2px; transition: opacity .15s; flex: none; }
  .habit:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: #e5484d; }

  .cell { display: flex; justify-content: center; }
  .check {
    width: 34px; height: 34px; border-radius: 11px; cursor: pointer;
    border: 2px solid var(--line); background: #fafbfd;
    display: grid; place-items: center; color: transparent; font-size: 16px; font-weight: 700;
    transition: background .15s, border-color .15s, transform .1s, color .15s;
  }
  .check:hover:not(:disabled) { border-color: var(--c); }
  .check:active:not(:disabled) { transform: scale(.92); }
  .check.on { background: var(--c); border-color: var(--c); color: #fff; box-shadow: 0 3px 10px color-mix(in srgb, var(--c) 35%, transparent); }
  .check.today:not(.on) { border-style: dashed; border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
  .check:disabled { cursor: default; opacity: .35; }

  /* Streak column: current streak on top, all-time best below */
  .streak { padding-left: 6px; display: flex; flex-direction: column; gap: 2px; }
  .streak .cur { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .streak .cur b { font-size: 18px; }
  .streak .cur span { font-size: 12px; color: var(--muted); }
  .streak.cold .cur { filter: grayscale(1); opacity: .55; }
  .streak .best { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .streak .best b { color: var(--text); }
  .streak .best.record b { color: var(--gold); }
  .streak.pop { animation: pop .6s ease; }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .empty div { font-size: 34px; margin-bottom: 8px; }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
  .stat { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
  .stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .stat .l { font-size: 12px; color: var(--muted); }

  /* Celebration */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .toast {
    position: fixed; left: 50%; top: 24px; z-index: 60;
    transform: translate(-50%, -140%); transition: transform .45s cubic-bezier(.2, .9, .3, 1.3);
    background: var(--card); box-shadow: 0 12px 40px rgba(20, 24, 40, .16); border-radius: 16px;
    padding: 12px 18px; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast .ico { font-size: 26px; }
  .toast b { display: block; }
  .toast span { font-size: 13px; color: var(--muted); }

  @media (max-width: 620px) {
    .wrap { padding-top: 24px; }
    .card { padding: 14px 10px; }
    .grid { grid-template-columns: minmax(90px, 1.4fr) repeat(7, minmax(26px, 1fr)) 52px; gap: 6px 2px; }
    .check { width: 28px; height: 28px; border-radius: 9px; font-size: 13px; }
    .streak .cur span, .streak .best .lbl { display: none; }
    .del { opacity: 1; }
    .summary { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
    .streak.pop { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <div class="sub" id="todayLabel"></div>
    </div>
    <div class="controls">
      <div class="weeknav">
        <button class="link-btn" id="thisWeek" data-t="thisWeek" hidden></button>
        <button class="icon-btn" id="prev">‹</button>
        <span id="weekLabel"></span>
        <button class="icon-btn" id="next">›</button>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="kk">ҚАЗ</button>
      </div>
    </div>
  </header>

  <form id="add" class="card" autocomplete="off">
    <input name="name" maxlength="60" required>
    <select name="target"></select>
    <button class="btn" type="submit" data-t="add"></button>
  </form>

  <div class="card"><div id="board"></div></div>
  <div class="summary" id="summary"></div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const KEY = 'habit-tracker-v1';
  const LANG_KEY = 'habit-tracker-lang';
  const COLORS = ['#5b6cff', '#22b07d', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6', '#ef6c3a', '#64748b'];

  // ---- translations ----
  const KK_MONTHS = ['қаңтар', 'ақпан', 'наурыз', 'сәуір', 'мамыр', 'маусым', 'шілде', 'тамыз', 'қыркүйек', 'қазан', 'қараша', 'желтоқсан'];
  const KK_WEEKDAYS = ['жексенбі', 'дүйсенбі', 'сейсенбі', 'сәрсенбі', 'бейсенбі', 'жұма', 'сенбі'];
  const I18N = {
    en: {
      dateLong: d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
      dateShort: d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
      title: 'Habits',
      placeholder: 'New habit, e.g. Read 20 minutes',
      target: 'Target frequency',
      everyDay: 'Every day',
      perWeek: n => `${n}× per week`,
      add: 'Add habit',
      thisWeek: 'This week',
      prevWeek: 'Previous week',
      nextWeek: 'Next week',
      days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
      habit: 'Habit',
      streak: 'Streak',
      daily: 'daily',
      perWk: n => `${n}×/wk`,
      unit: (n, weekly) => weekly ? (n === 1 ? 'week' : 'weeks') : (n === 1 ? 'day' : 'days'),
      best: 'best',
      empty: 'No habits yet. Add your first one above.',
      deleteLabel: name => `Delete ${name}`,
      deleteTitle: 'Delete habit',
      confirmDelete: name => `Delete "${name}" and all its history?`,
      doneToday: 'Done today',
      targetsHit: 'Weekly targets hit',
      bestCurrent: 'Best current streak',
      longestEver: 'Longest streak ever',
      newRecord: 'New personal best!',
      recordText: (name, n, unit) => `${name}: ${n} ${unit} in a row`,
      on: (name, day) => `${name} on ${day}`,
    },
    kk: {
      // spelled out by hand: many browsers ship without Kazakh date data
      dateLong: d => `${d.getDate()} ${KK_MONTHS[d.getMonth()]}, ${KK_WEEKDAYS[d.getDay()]}`,
      dateShort: d => `${d.getDate()} ${KK_MONTHS[d.getMonth()].slice(0, 3)}.`,
      title: 'Әдеттер',
      placeholder: 'Жаңа әдет, мысалы: 20 минут кітап оқу',
      target: 'Мақсатты жиілік',
      everyDay: 'Күн сайын',
      perWeek: n => `Аптасына ${n} рет`,
      add: 'Әдет қосу',
      thisWeek: 'Осы апта',
      prevWeek: 'Алдыңғы апта',
      nextWeek: 'Келесі апта',
      days: ['Дс', 'Сс', 'Ср', 'Бс', 'Жм', 'Сб', 'Жс'],
      habit: 'Әдет',
      streak: 'Серия',
      daily: 'күн сайын',
      perWk: n => `аптасына ${n}`,
      unit: (n, weekly) => weekly ? 'апта' : 'күн',
      best: 'рекорд',
      empty: 'Әзірге әдет жоқ. Біріншісін жоғарыда қосыңыз.',
      deleteLabel: name => `${name} әдетін жою`,
      deleteTitle: 'Әдетті жою',
      confirmDelete: name => `«${name}» әдеті мен оның бүкіл тарихы жойылсын ба?`,
      doneToday: 'Бүгін орындалды',
      targetsHit: 'Апталық мақсат орындалды',
      bestCurrent: 'Ең үздік ағымдағы серия',
      longestEver: 'Барлық уақыттағы рекорд',
      newRecord: 'Жаңа жеке рекорд!',
      recordText: (name, n, unit) => `${name}: қатарынан ${n} ${unit}`,
      on: (name, day) => `${name}, ${day}`,
    },
  };

  let lang = loadLang();
  const T = () => I18N[lang];
  function loadLang() {
    try {
      const l = localStorage.getItem(LANG_KEY);
      if (l && I18N[l]) return l;
    } catch (e) {}
    return (navigator.language || '').toLowerCase().startsWith('kk') ? 'kk' : 'en';
  }

  // ---- storage ----
  let state = load();
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.habits)) return s;
    } catch (e) {}
    return { habits: [] }; // habit: {id, name, target, color, created, done: {YYYY-MM-DD: 1}}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---- dates (local time) ----
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const mondayOf = d => { const x = startOfDay(d); return addDays(x, -((x.getDay() + 6) % 7)); };
  const today = () => startOfDay(new Date());

  let weekOffset = 0;

  // ---- streaks ----
  const isDaily = h => h.target >= 7;
  function weekCount(h, monday) {
    let n = 0;
    for (let i = 0; i < 7; i++) if (h.done[keyOf(addDays(monday, i))]) n++;
    return n;
  }
  function streak(h) {
    const t = today();
    if (isDaily(h)) {
      // consecutive days; today not done yet doesn't break the streak
      let d = h.done[keyOf(t)] ? t : addDays(t, -1), n = 0;
      while (h.done[keyOf(d)]) { n++; d = addDays(d, -1); }
      return n;
    }
    // consecutive weeks hitting the target; the current week counts once met
    let m = mondayOf(t), n = 0;
    if (weekCount(h, m) >= h.target) n++;
    m = addDays(m, -7);
    const created = mondayOf(new Date(h.created));
    while (m >= created && weekCount(h, m) >= h.target) { n++; m = addDays(m, -7); }
    return n;
  }
  // longest run ever, scanned over the whole history
  function longest(h) {
    const keys = Object.keys(h.done).sort();
    if (!keys.length) return 0;
    let best = 0, run = 0, prev = null;
    if (isDaily(h)) {
      for (const k of keys) {
        const d = parseKey(k);
        run = prev && keyOf(addDays(prev, 1)) === k ? run + 1 : 1;
        best = Math.max(best, run);
        prev = d;
      }
      return best;
    }
    const last = mondayOf(today());
    for (let m = mondayOf(parseKey(keys[0])); m <= last; m = addDays(m, 7)) {
      run = weekCount(h, m) >= h.target ? run + 1 : 0;
      best = Math.max(best, run);
    }
    return best;
  }

  // ---- render ----
  const $ = s => document.querySelector(s);
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function renderStatic() {
    const t = T();
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
    const f = $('#add');
    f.name.placeholder = t.placeholder;
    f.target.setAttribute('aria-label', t.target);
    const sel = f.target.value || '3';
    f.target.innerHTML = [7, 6, 5, 4, 3, 2, 1]
      .map(n => `<option value="${n}">${n === 7 ? t.everyDay : t.perWeek(n)}</option>`).join('');
    f.target.value = sel;
    $('#prev').setAttribute('aria-label', t.prevWeek);
    $('#next').setAttribute('aria-label', t.nextWeek);
  }

  function render(popId) {
    const tr = T(), t = today(), tKey = keyOf(t);
    const monday = addDays(mondayOf(t), weekOffset * 7);
    const days = tr.days.map((_, i) => addDays(monday, i));

    $('#todayLabel').textContent = tr.dateLong(t);
    $('#weekLabel').textContent = weekOffset === 0 ? tr.thisWeek
      : `${tr.dateShort(days[0])} – ${tr.dateShort(days[6])}`;
    $('#thisWeek').hidden = weekOffset === 0;
    $('#next').disabled = weekOffset >= 0;

    const board = $('#board');
    if (!state.habits.length) {
      board.innerHTML = `<div class="empty"><div>🌱</div>${tr.empty}</div>`;
      renderSummary();
      return;
    }

    let html = `<div class="grid"><div class="head">${tr.habit}</div>`;
    days.forEach((d, i) => {
      html += `<div class="head ${keyOf(d) === tKey ? 'today' : ''}">${tr.days[i]}<small>${d.getDate()}</small></div>`;
    });
    html += `<div class="head">${tr.streak}</div>`;

    state.habits.forEach(h => {
      const count = weekCount(h, monday);
      const goal = Math.min(h.target, 7);
      const pct = Math.min(100, Math.round(count / goal * 100));
      const cur = streak(h), best = longest(h), weekly = !isDaily(h);
      const freq = weekly ? tr.perWk(h.target) : tr.daily;
      const name = esc(h.name);
      html += `<div class="row-sep"></div>
        <div class="habit">
          <div class="name"><span class="dot" style="background:${h.color}"></span><span title="${name}">${name}</span>
            <button class="del" data-del="${h.id}" title="${tr.deleteTitle}" aria-label="${esc(tr.deleteLabel(h.name))}">✕</button></div>
          <div class="meta"><span>${count}/${goal} · ${freq}</span><span class="bar"><i style="width:${pct}%;background:${h.color}"></i></span></div>
        </div>`;
      days.forEach(d => {
        const k = keyOf(d), on = !!h.done[k], future = d > t;
        html += `<div class="cell"><button class="check ${on ? 'on' : ''} ${k === tKey ? 'today' : ''}" style="--c:${h.color}"
          data-id="${h.id}" data-day="${k}" ${future ? 'disabled' : ''}
          aria-pressed="${on}" aria-label="${esc(tr.on(h.name, tr.dateLong(d)))}">✓</button></div>`;
      });
      const atRecord = best > 0 && cur === best;
      html += `<div class="streak ${cur ? '' : 'cold'} ${popId === h.id ? 'pop' : ''}" data-streak="${h.id}">
          <div class="cur">🔥 <b>${cur}</b> <span>${tr.unit(cur, weekly)}</span></div>
          <div class="best ${atRecord ? 'record' : ''}" title="${tr.longestEver}">🏆 <span class="lbl">${tr.best}</span> <b>${best}</b></div>
        </div>`;
    });
    board.innerHTML = html + `</div>`;
    renderSummary();
  }

  function renderSummary() {
    const tr = T(), t = today(), tKey = keyOf(t), monday = mondayOf(t);
    const hs = state.habits;
    const doneToday = hs.filter(h => h.done[tKey]).length;
    const onTrack = hs.filter(h => weekCount(h, monday) >= h.target).length;
    const bestCur = hs.reduce((b, h) => Math.max(b, streak(h)), 0);
    const bestEver = hs.reduce((b, h) => Math.max(b, longest(h)), 0);
    $('#summary').innerHTML = `
      <div class="stat"><div class="v">${doneToday}/${hs.length}</div><div class="l">${tr.doneToday}</div></div>
      <div class="stat"><div class="v">${onTrack}/${hs.length}</div><div class="l">${tr.targetsHit}</div></div>
      <div class="stat"><div class="v">🔥 ${bestCur}</div><div class="l">${tr.bestCurrent}</div></div>
      <div class="stat"><div class="v">🏆 ${bestEver}</div><div class="l">${tr.longestEver}</div></div>`;
  }

  // ---- celebration ----
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const canvas = $('#confetti'), ctx = canvas.getContext('2d');
  let particles = [], animating = false;

  function confetti(x, y, colors) {
    if (reduceMotion.matches) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const palette = [...colors, '#f5a524', '#ffd166', '#ffffff'];
    for (let i = 0; i < 140; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1;
      const v = 6 + Math.random() * 9;
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 6 + Math.random() * 6, h: 4 + Math.random() * 6,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .35,
        c: palette[(Math.random() * palette.length) | 0],
        life: 0, max: 90 + Math.random() * 50,
      });
    }
    if (!animating) { animating = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter(p => p.life < p.max && p.y < innerHeight + 20);
    for (const p of particles) {
      p.life++;
      p.vy += .32; p.vx *= .985; p.vy *= .985;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.life * .15)));
      ctx.restore();
    }
    if (particles.length) requestAnimationFrame(tick);
    else { animating = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  let toastTimer;
  function toast(h, n) {
    const tr = T(), el = $('#toast');
    el.innerHTML = `<div class="ico">🏆</div><div><b>${tr.newRecord}</b><span>${esc(tr.recordText(h.name, n, tr.unit(n, !isDaily(h))))}</span></div>`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  // ---- events ----
  $('#add').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target, name = f.name.value.trim();
    if (!name) return;
    state.habits.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name,
      target: +f.target.value,
      color: COLORS[state.habits.length % COLORS.length],
      created: Date.now(),
      done: {}
    });
    save();
    f.name.value = '';
    weekOffset = 0;
    render();
  });

  $('#board').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) {
      const h = state.habits.find(x => x.id === del.dataset.del);
      if (h && confirm(T().confirmDelete(h.name))) {
        state.habits = state.habits.filter(x => x !== h);
        save(); render();
      }
      return;
    }
    const btn = e.target.closest('.check');
    if (!btn || btn.disabled) return;
    const h = state.habits.find(x => x.id === btn.dataset.id);
    if (!h) return;
    const k = btn.dataset.day;
    const before = longest(h);
    const adding = !h.done[k];
    if (adding) h.done[k] = 1; else delete h.done[k];
    // a check before the creation date extends the streak window back
    const d = parseKey(k).getTime();
    if (d < h.created) h.created = d;
    save();

    const after = longest(h);
    // celebrate a new all-time best (a single day is too small to count for daily habits)
    const isRecord = adding && after > before && after >= (isDaily(h) ? 2 : 1);
    render(isRecord ? h.id : null);
    if (isRecord) {
      const r = btn.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2, [h.color]);
      toast(h, after);
    }
  });

  $('#prev').addEventListener('click', () => { weekOffset--; render(); });
  $('#next').addEventListener('click', () => { if (weekOffset < 0) { weekOffset++; render(); } });
  $('#thisWeek').addEventListener('click', () => { weekOffset = 0; render(); });

  document.querySelector('.lang').addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    renderStatic(); render();
  });

  // re-render when the day rolls over or the tab regains focus
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  setInterval(render, 60 * 1000);

  renderStatic();
  render();
})();
</script>
</body>
</html>
